services:
  sample-app:
    build: ../module-01-prometheus-and-setup/sample-app
    ports:
      - "8000:8000"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml

  grafana:
    image: grafana/grafana:12.0.2
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

  traffic:
    image: curlimages/curl:8.14.1
    depends_on:
      - sample-app
    entrypoint:
      - sh
      - -c
      - |
        i=0
        while true; do
          curl -s http://sample-app:8000/ > /dev/null
          curl -s http://sample-app:8000/work > /dev/null
          i=$$((i+1))
          if [ $$((i % 5)) -eq 0 ]; then
            curl -s http://sample-app:8000/error > /dev/null
          fi
          sleep 1
        done

volumes:
  grafana-data:
    # Same volume as module 3, so your dashboard is still here.
    name: module-03-grafana-dashboards_grafana-data
