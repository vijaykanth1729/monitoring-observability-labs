services:
  sample-app:
    build: ../sample-app
    ports:
      - "8000:8000"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
